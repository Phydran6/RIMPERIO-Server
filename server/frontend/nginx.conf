# WebSocket-Upgrade nur durchreichen, wenn der Browser es auch verlangt.
# Ein fest gesetztes "Connection: upgrade" wuerde jede gewoehnliche Anfrage
# stoeren.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache + compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/vnd.ms-fontobject application/x-font-ttf application/xhtml+xml application/xml image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # Content-Security-Policy fuer die Oberflaeche. Der Anmelde-Token liegt im
    # localStorage - eine eingeschleuste Skriptzeile koennte ihn lesen. Die CSP
    # laesst nur Skripte von diesem Server zu (kein Inline-Skript, kein eval,
    # nichts von fremden Servern) und Verbindungen nur zurueck zu diesem Server.
    # Inline-Styles bleiben erlaubt: Vue-Vorlagen setzen sie haeufig, und ueber
    # CSS allein laesst sich kein Token stehlen.
    set $rimperio_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $rimperio_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback. index.html nie aus dem Zwischenspeicher: nach einem Update
    # zeigt sie auf neue Dateinamen, eine alte Kopie liefe ins Leere.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $rimperio_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
    
    # Ersatzweg zur API. Im Regelbetrieb geht /api direkt ueber Caddy - dieser
    # Block greift nur, wenn jemand den Frontend-Container unmittelbar
    # anspricht. Er muss trotzdem alles koennen, was die Oberflaeche braucht:
    #
    #   Upgrade/Connection  fuer die Konsole (WebSocket). Ohne diese beiden
    #                       Kopfzeilen bleibt die Verbindung ein gewoehnliches
    #                       HTTP und die Shell kommt nie zustande.
    #   proxy_buffering off fuer die Ereignisstroeme (Server-Sent Events):
    #                       Update-Ausgabe und Systemtagebuch laufen live mit.
    #                       Mit Pufferung kaeme alles erst am Ende auf einmal.
    #   read_timeout        ein Ereignisstrom ist lange still; die Vorgabe von
    #                       60 s wuerde ihn im Minutentakt kappen.
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
