# ---------------------------------------------------------------------------
# Datei:        .github/workflows/smoke.yml
# Projekt:      RIMPERIO
# Autor:        Phydran6
# Version:      2026.11.08.17.00.00
# Beschreibung: Startet den kompletten Stack (docker compose) und spielt einmal
#               alles Wesentliche durch: Anmeldung, Zugangsschlüssel, echter
#               Go-Agent über den echten Linux-Installer (eigenes Dienstkonto
#               statt root, alles unter /opt/RMM/rimperio, sudo nur über das
#               Hilfsskript): Anmeldung, Inventur, Check-in, Befehl, Check,
#               Patch- und Docker-Suche, Update, Deinstallation auf allen drei
#               Wegen. Dazu der Log-Agent (HTTPS) neben dem Fernwartungs-Agent,
#               die Übernahme älterer Installationen, die als root liefen,
#               Syslog und die RMM- und Log-Schnittstellen. Fehler stehen als
#               Annotation am Lauf (ohne Anmeldung lesbar).
# ---------------------------------------------------------------------------
name: Smoke

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: agent/go.sum

      - name: Stack bauen und starten
        run: |
          printf 'DB_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > .env
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -fsS http://localhost/api/health >/dev/null 2>&1 && { echo "Backend nach ${i}x2 s bereit"; exit 0; }
            sleep 2
          done
          echo "::error title=Smoke::Backend wurde nicht gesund"; exit 1

      - name: Agent bauen
        working-directory: agent
        run: CGO_ENABLED=0 go build -o /tmp/rimperio-agent ./cmd/rimperio-agent

      - name: HTTPS-Vorschaltung für den Log-Agent
        # Der Log-Agent spricht nur HTTPS; Caddy liefert ab Werk nur HTTP. Ein
        # kleiner Proxy mit Selbstzertifikat davor (Port 8443).
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/tls.key -out /tmp/tls.crt \
            -days 1 -subj /CN=localhost 2>/dev/null
          cat > /tmp/tlsproxy.py <<'EOF'
          import http.server, ssl, urllib.error, urllib.request

          UPSTREAM = "http://127.0.0.1:80"
          SKIP = {"connection", "keep-alive", "transfer-encoding", "content-length", "host",
                  "accept-encoding", "server", "date"}

          class Proxy(http.server.BaseHTTPRequestHandler):
              def forward(self):
                  length = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(length) if length else None
                  headers = {k: v for k, v in self.headers.items() if k.lower() not in SKIP}
                  req = urllib.request.Request(UPSTREAM + self.path, data=body, method=self.command,
                                               headers=headers)
                  try:
                      resp = urllib.request.urlopen(req, timeout=60)
                  except urllib.error.HTTPError as err:
                      resp = err
                  data = resp.read()
                  self.send_response(resp.getcode())
                  for k, v in resp.headers.items():
                      if k.lower() not in SKIP:
                          self.send_header(k, v)
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              do_GET = do_POST = do_PUT = do_DELETE = forward

              def log_message(self, *args):
                  pass

          server = http.server.ThreadingHTTPServer(("127.0.0.1", 8443), Proxy)
          ctx = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
          ctx.load_cert_chain("/tmp/tls.crt", "/tmp/tls.key")
          server.socket = ctx.wrap_socket(server.socket, server_side=True)
          server.serve_forever()
          EOF
          nohup python3 /tmp/tlsproxy.py >/tmp/tlsproxy.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsk https://127.0.0.1:8443/api/health >/dev/null 2>&1 && { echo "HTTPS-Vorschaltung bereit"; exit 0; }
            sleep 1
          done
          cat /tmp/tlsproxy.log
          echo "::error title=Smoke::HTTPS-Vorschaltung startet nicht"; exit 1

      - name: Durchspielen
        run: |
          set -u
          B=http://localhost
          fail=0
          check() { if eval "$2"; then echo "ok   $1"; else echo "::error title=Smoke::$1"; fail=1; fi; }
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }
          # wait_for BEDINGUNG SEKUNDEN
          wait_for() { local i; for i in $(seq 1 "$2"); do eval "$1" && return 0; sleep 1; done; return 1; }
          invite() { api -X POST "$B/api/agent-tokens" -d "{\"name\":\"$1\",\"kind\":\"enroll\"}" | jq -r .token; }
          install_rmm() { sudo bash agent/installer/linux/install-agent.sh --binary /tmp/rimperio-agent --server "$B" --site Smoke "$@"; }
          install_log() { sudo bash agent/logship/install-linux.sh --mode https --yes --fqdn 127.0.0.1 --port 8443 --insecure "$@"; }
          runs_as() { ps -o user= -p "$(systemctl show -p MainPID --value "$1")" | tr -d ' '; }
          kick() { sudo systemctl restart rimperio-agent; }   # Neustart = sofort ein Takt
          agents() { api "$B/api/rmm/agents" | jq -r "$1"; }
          first_done() { api "$B/api/rmm/agents/$UID_/commands" | jq -e '.[0].status=="done"' >/dev/null; }
          cmd_done() { api "$B/api/rmm/agents/$UID_/commands" | jq -e --arg k "$1" '[.[]|select(.kind==$k)][0].status=="done"' >/dev/null; }
          check_results() { api "$B/api/rmm/checks/results?uid=$UID_" | jq -e "length>=1" >/dev/null; }
          log_arrived() { api "$B/api/logs?search=$1" | grep -q "$1"; }
          rmm_gone() { ! test -e /etc/systemd/system/rimperio-agent.service && ! test -e /etc/sudoers.d/rimperio-agent && ! sudo test -e /opt/RMM/rimperio/bin/rimperio-agent; }
          all_gone() { rmm_gone && ! test -e /opt/RMM && ! getent passwd rimperio >/dev/null; }
          H=/opt/RMM/rimperio/lib/rimperio-helper
          A_BIN=/opt/RMM/rimperio/bin/rimperio-agent

          TOKEN=$(curl -sS -X POST "$B/api/auth/login" -d 'username=admin&password=admin' | jq -r .access_token)
          check "Anmeldung admin/admin" '[ -n "$TOKEN" ] && [ "$TOKEN" != null ]'

          # --- 1. Fernwartungs-Agent über den echten Installer -----------------
          INVITE=$(invite smoke)
          check "Einladung anlegen" '[ -n "$INVITE" ] && [ "$INVITE" != null ]'
          install_rmm --secret "$INVITE" --desc CI
          UID_=$(agents '.[0].agent_uid')
          check "Agent angemeldet"                '[ -n "$UID_" ] && [ "$UID_" != null ]'
          check "Dienstkonto rimperio angelegt"   'getent passwd rimperio | grep -q "RIMPERIO Agent"'
          check "Dienst läuft als rimperio"       '[ "$(runs_as rimperio-agent)" = rimperio ]'
          check "Alles unter /opt/RMM/rimperio"   'sudo test -x $A_BIN && sudo test -f /opt/RMM/rimperio/etc/agent.json && ! test -e /usr/local/bin/rimperio-agent && ! sudo test -e /etc/rimperio'
          check "Konfiguration gehört dem Konto"  '[ "$(sudo stat -c "%U %a" /opt/RMM/rimperio/etc/agent.json)" = "rimperio 600" ]'
          check "Programm und Hilfsskript: root"  '[ "$(stat -c "%U %a" $A_BIN $H | sort -u)" = "root 755" ]'
          check "sudo-Regel gültig"               'sudo visudo -cf /etc/sudoers.d/rimperio-agent >/dev/null'
          check "Konto erreicht das Hilfsskript"  'sudo -u rimperio sudo -n $H version | grep -q rimperio'
          check "Konto bekommt sonst kein root"   '! sudo -u rimperio sudo -n /usr/bin/id >/dev/null 2>&1'
          check "Hilfsskript: keine Paketdateien" '! sudo -u rimperio sudo -n $H pkg-upgrade evil.deb >/dev/null 2>&1'
          check "Hilfsskript: keine Pfade"        '! sudo -u rimperio sudo -n $H pkg-upgrade ./evil >/dev/null 2>&1'
          check "Hilfsskript: keine Optionen"     '! sudo -u rimperio sudo -n $H pkg-upgrade -o APT::Update::Pre-Invoke::=id >/dev/null 2>&1'
          check "Hilfsskript: installiert nichts Neues" 'sudo -u rimperio sudo -n $H pkg-upgrade hello >/dev/null 2>&1; ! dpkg -s hello >/dev/null 2>&1'
          check "setup verweist auf den Installer" '! sudo $A_BIN setup -server x -secret y >/dev/null 2>&1'

          # --- 2. Befehle, Checks, Patch- und Docker-Suche über den laufenden Dienst
          api -X POST "$B/api/rmm/agents/$UID_/commands" -d '{"shell":"sh","command":"echo hallo-rimperio; echo konto=$(id -un)","timeout":30}' >/dev/null
          api -X POST "$B/api/rmm/checks" -d '{"name":"Platte","type":"disk","params":{"max":99},"interval_sec":60}' >/dev/null
          api -X POST "$B/api/rmm/scripts" -d '{"name":"Uptime","shell":"sh","body":"uptime","platform":"linux"}' >/dev/null
          kick
          wait_for first_done 90 || true
          kick                                  # zweiter Takt: Check nach Checkliste
          A=$(api "$B/api/rmm/agents/$UID_")
          check "Agent online"            '[ "$(echo "$A" | jq -r .online)" = true ]'
          check "Messwerte da"            '[ "$(echo "$A" | jq -r .last_cpu)" != null ]'
          check "Inventur da"             '[ "$(echo "$A" | jq -r ".inventory | length")" -gt 0 ]'
          check "Inventur nennt das Konto" '[ "$(echo "$A" | jq -r .inventory.agent_user)" = rimperio ]'
          check "Befehl ausgeführt"       'api "$B/api/rmm/agents/$UID_/commands" | jq -e ".[0].status==\"done\" and (.[0].stdout|test(\"hallo-rimperio\"))" >/dev/null'
          check "Befehl läuft als Dienstkonto, nicht root" 'api "$B/api/rmm/agents/$UID_/commands" | jq -e ".[0].stdout|test(\"konto=rimperio\")" >/dev/null'
          check "Check-Ergebnis da"       'wait_for check_results 90'
          check "Skripte lesbar"          'api "$B/api/rmm/scripts" | jq -e "length==1" >/dev/null'
          check "Übersicht"               'api "$B/api/rmm/summary" | jq -e ".agents_total==1 and .agents_online==1" >/dev/null'
          check "Telemetrie"              'api "$B/api/rmm/agents/$UID_/telemetry?hours=1" | jq -e "length>=1" >/dev/null'
          check "Patches/Alarme/Settings" 'api "$B/api/rmm/patches" | jq -e "type==\"array\"" >/dev/null && api "$B/api/rmm/alerts" | jq -e "type==\"array\"" >/dev/null && api "$B/api/rmm/settings" | jq -e ".thresholds.cpu_percent" >/dev/null'
          check "Gerät in der Geräteliste mit RMM" 'api "$B/api/agents" | jq -e "[.items[] | select(.agent_uid==\"$UID_\")] | length==1" >/dev/null'

          # Patchmanagement: Paketlisten über das Hilfsskript (sudo), Docker über die Gruppe docker.
          T0=$(date '+%Y-%m-%d %H:%M:%S')
          api -X POST "$B/api/patching/agents/$UID_/scan" >/dev/null
          kick
          wait_for 'cmd_done patch_scan && cmd_done docker_scan' 300 || true
          check "Patch-Suche verarbeitet"   'cmd_done patch_scan'
          check "Paketlisten per sudo und Hilfsskript" 'sudo journalctl -t sudo --since "$T0" --no-pager | grep -q "rimperio-helper pkg-refresh"'
          check "Docker-Suche verarbeitet"  'api "$B/api/patching/agents/$UID_/docker" | jq -e ".available==true and (.containers|length)>=3" >/dev/null'
          check "Patch-Center Übersicht"    'api "$B/api/patching/overview" | jq -e ".agents|length==1" >/dev/null'
          check "Richtlinie, Quellen, SNMP, Eingang" 'api "$B/api/patching/policies" | jq -e "length>=1" >/dev/null && api "$B/api/patching/sources" | jq -e ".sources|length>=8" >/dev/null && api "$B/api/snmp/templates" | jq -e "length>=10" >/dev/null && api "$B/api/notifications" | jq -e ".items|type==\"array\"" >/dev/null'
          check "App-Schnittstelle Level 3" 'api "$B/api/app/patching/summary" | jq -e ".needs_approval>=0" >/dev/null && api "$B/api/app/bootstrap" | jq -e ".server.api_level>=3" >/dev/null'

          # --- 3. Deinstallieren aus der Oberfläche: der Dienst räumt selbst ab
          R=$(api -X DELETE "$B/api/rmm/agents/$UID_?uninstall=true")
          check "Deinstallation eingereiht"  '[ "$(echo "$R" | jq -r .status)" = uninstall_queued ]'
          check "Liste zeigt Deinstallation" 'api "$B/api/rmm/agents" | jq -e ".[0].uninstall_pending==true" >/dev/null'
          kick
          wait_for all_gone 90 || true
          check "Agent hat sich abgemeldet"  'api "$B/api/rmm/agents" | jq -e "length==0" >/dev/null'
          check "Gerät ohne Logs ist weg"    'api "$B/api/agents" | jq -e "[.items[] | select(.hostname==\"$(hostname)\")] | length==0" >/dev/null'
          check "Dienst, Programm, sudo-Regel weg" 'rmm_gone'
          check "Dienstkonto und /opt/RMM weg" '! getent passwd rimperio >/dev/null && ! test -e /opt/RMM'

          # --- 4. Zweiter Lauf = Update (Anmeldung bleibt), dann "uninstall" am Rechner
          INVITE2=$(invite smoke2)
          install_rmm --secret "$INVITE2"
          UID2=$(agents '.[0].agent_uid')
          check "Erneut angemeldet"            'api "$B/api/rmm/agents" | jq -e "length==1" >/dev/null'
          install_rmm
          check "Update behält die Anmeldung"  '[ "$(agents ".[0].agent_uid")" = "$UID2" ] && api "$B/api/rmm/agents" | jq -e "length==1" >/dev/null'
          check "Update: läuft als rimperio"   '[ "$(runs_as rimperio-agent)" = rimperio ]'
          sudo $A_BIN uninstall
          check "uninstall meldet ab"          'api "$B/api/rmm/agents" | jq -e "length==0" >/dev/null'
          check "uninstall räumt alles ab"     'all_gone'

          # --- 5. Nur den Eintrag entfernen: der Agent wird danach abgewiesen
          INVITE3=$(invite smoke3)
          install_rmm --secret "$INVITE3"
          sudo systemctl stop rimperio-agent
          UID3=$(agents '.[0].agent_uid')
          R=$(api -X DELETE "$B/api/rmm/agents/$UID3")
          check "Eintrag entfernt"             '[ "$(echo "$R" | jq -r .device_deleted)" = true ]'
          check "Agent wird abgewiesen"        '! sudo $A_BIN once >/dev/null 2>&1'
          check "once mit sudo läuft als Konto" 'sudo $A_BIN once 2>&1 | grep -q "Läuft als Dienstkonto"'
          sudo $A_BIN uninstall   # 401 zählt als „schon abgemeldet“
          check "Aufgeräumt nach Abweisung"    'all_gone'

          # --- 6. Log-Agent (wie beim Einbinden per SSH) neben dem Fernwartungs-Agent
          INVITE4=$(invite smoke4); INVITE5=$(invite smoke5)
          install_rmm --secret "$INVITE4"
          install_log --token "$INVITE5" --user rimperio
          check "Log-Agent läuft als rimperio"   '[ "$(runs_as rimperio-log-agent)" = rimperio ]'
          check "Log-Agent unter /opt/RMM/rimperio" 'sudo test -f /opt/RMM/rimperio/lib/log-agent.py && [ "$(sudo stat -c "%U %a" /opt/RMM/rimperio/etc/log-agent.json)" = "rimperio 600" ]'
          check "Beide Dienste laufen"           'systemctl is-active --quiet rimperio-agent && systemctl is-active --quiet rimperio-log-agent'
          check "Anderes Konto wird abgewiesen"  '! install_log --token rmp_abcdef0123456789 --user anders >/dev/null 2>&1 && ! getent passwd anders >/dev/null'
          sleep 3
          logger -t smoke "logagent-rimperio-test"
          check "Log-Agent liest das Journal ohne root" 'wait_for "log_arrived logagent-rimperio-test" 90'
          sudo bash agent/logship/install-linux.sh uninstall --yes
          check "Log-Agent weg, Fernwartung bleibt" '! test -e /etc/systemd/system/rimperio-log-agent.service && systemctl is-active --quiet rimperio-agent && getent passwd rimperio >/dev/null'
          sudo $A_BIN uninstall
          check "Zuletzt alles weg"              'all_gone'

          # --- 7. Übernahme älterer Fassungen, die als root liefen -----------
          OLD=v2026.11.07.3
          RAW_OLD="https://raw.githubusercontent.com/Phydran6/RIMPERIO-Server/$OLD"
          curl -fsSL "$RAW_OLD/agent/installer/linux/install-agent.sh" -o /tmp/old-agent.sh
          curl -fsSL "$RAW_OLD/agent/logship/install-linux.sh" -o /tmp/old-log.sh

          # 7a) Fernwartung: /usr/local/bin + /etc/rimperio, als root
          INVITE6=$(invite smoke6)
          sudo env RIMPERIO_BASE_URL="https://github.com/Phydran6/RIMPERIO-Server/releases/download/$OLD" \
            bash /tmp/old-agent.sh --server "$B" --secret "$INVITE6" --site Smoke
          check "Alte Fernwartung läuft als root" '[ "$(runs_as rimperio-agent)" = root ] && sudo test -f /etc/rimperio/agent.json'
          UID6=$(agents '.[0].agent_uid')
          install_rmm                             # ohne Schlüssel: übernimmt die Anmeldung
          check "Übernahme: dieselbe Anmeldung"   '[ "$(agents ".[0].agent_uid")" = "$UID6" ] && api "$B/api/rmm/agents" | jq -e "length==1" >/dev/null'
          check "Übernahme: läuft als rimperio"   '[ "$(runs_as rimperio-agent)" = rimperio ]'
          check "Übernahme: Altlasten weg"        '! test -e /usr/local/bin/rimperio-agent && ! sudo test -e /etc/rimperio'
          sudo $A_BIN uninstall
          check "Übernahme: danach alles weg"     'all_gone && api "$B/api/rmm/agents" | jq -e "length==0" >/dev/null'

          # 7b) Log-Agent: /opt/rimperio-agent, als root, Dienst hieß rimperio-agent
          INVITE7=$(invite smoke7); INVITE8=$(invite smoke8)
          sudo bash /tmp/old-log.sh --mode https --yes --fqdn 127.0.0.1 --port 8443 --insecure --token "$INVITE7"
          check "Alter Log-Agent läuft als root"  '[ "$(runs_as rimperio-agent)" = root ] && grep -q rimperio_agent.py /etc/systemd/system/rimperio-agent.service'
          install_rmm --secret "$INVITE8"
          check "Alter Log-Agent umbenannt, läuft weiter" 'systemctl is-active --quiet rimperio-log-agent && grep -q rimperio_agent.py /etc/systemd/system/rimperio-log-agent.service'
          check "Fernwartung daneben als rimperio" '[ "$(runs_as rimperio-agent)" = rimperio ]'
          sudo bash agent/logship/install-linux.sh --yes   # ohne Token: übernimmt die alte Einrichtung
          check "Log-Agent übernommen: als rimperio" '[ "$(runs_as rimperio-log-agent)" = rimperio ]'
          check "Log-Agent übernommen: Altlasten weg" '! test -e /opt/rimperio-agent && ! grep -qs rimperio_agent.py /etc/systemd/system/rimperio-agent.service /etc/systemd/system/rimperio-log-agent.service'
          sleep 3
          logger -t smoke "logagent-migriert-test"
          check "Übernommener Log-Agent liefert"   'wait_for "log_arrived logagent-migriert-test" 90'
          sudo bash agent/logship/install-linux.sh uninstall --yes
          sudo $A_BIN uninstall
          check "Zum Schluss alles weg"            'all_gone && ! test -e /etc/systemd/system/rimperio-log-agent.service'

          # Syslog: eine Zeile an Port 514 schicken und in den Logs wiederfinden.
          echo "<14>$(date '+%b %d %H:%M:%S') smokehost smoke: syslog-rimperio-test" | nc -u -w1 127.0.0.1 514 || true
          sleep 5
          check "Syslog angekommen" 'api "$B/api/logs?search=syslog-rimperio-test" | grep -q syslog-rimperio-test'

          check "Frontend ausgeliefert" 'curl -fsS "$B/" | grep -qi "<div id=\"app\""'
          exit $fail

      - name: Bei Fehlern Logs anhängen
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200 backend | tee /tmp/backend.log
          grep -E "Error|Exception|Traceback|error" /tmp/backend.log | tail -15 | while IFS= read -r l; do echo "::error title=Backend-Log::$l"; done
          sudo journalctl -u rimperio-agent -u rimperio-log-agent -u 'rimperio-agent-remove-*' --no-pager -n 120 | tee /tmp/agent.log || true
          grep -Ei "fehl|error|denied|verweigert|nicht" /tmp/agent.log | tail -15 | while IFS= read -r l; do echo "::error title=Agent-Log::$l"; done
