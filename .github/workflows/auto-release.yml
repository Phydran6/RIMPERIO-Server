# ---------------------------------------------------------------------------
# Datei:        .github/workflows/auto-release.yml
# Projekt:      RIMPERIO
# Autor:        Phydran6
# Version:      2026.11.23.22.00.00
# Beschreibung: Legt automatisch Tag und Release an, sobald auf main eine neue
#               VERSION liegt - und stoesst danach den Agent-Build an.
#
# Warum: Der Update-Kanal "Stabil" der Server folgt nur veroeffentlichten
# Releases. Wurde nach einem Merge das Tag vergessen, kam die Aenderung nie
# an. Jetzt reicht es, VERSION hochzuzaehlen.
#
# Tag-Name: v<JAHR>.<MONAT>.<TAG>, weitere am selben Tag .2, .3, …
# (wie bisher von Hand: v2026.11.21, v2026.11.21.2, …).
# Hat schon ein Tag genau diese VERSION, passiert nichts.
#
# Ein Tag, das mit dem GITHUB_TOKEN angelegt wird, startet keine weiteren
# Workflows - darum wird agent-release.yml ausdruecklich auf dem Tag gestartet
# (workflow_dispatch ist davon ausgenommen).
# ---------------------------------------------------------------------------
name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/auto-release.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag bestimmen
        id: tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]{2}){3}$ ]]; then
            echo "::error::VERSION '$version' hat nicht das Format JJJJ.MM.TT.HH.MM.SS"; exit 1
          fi
          for t in $(git tag -l 'v*'); do
            if [ "$(git show "$t:VERSION" 2>/dev/null | tr -d '[:space:]')" = "$version" ]; then
              echo "Version $version ist schon als $t veröffentlicht - nichts zu tun."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          day="v${version:0:10}"
          tag="$day"; n=2
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do tag="$day.$n"; n=$((n+1)); done
          echo "Neues Release: $tag (VERSION $version)"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag und Release anlegen
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "RIMPERIO $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          # Abschnitt dieser Version aus dem Release-Verlauf als Notiz.
          awk -v v="## v$VERSION" 'index($0, v) == 1 {on=1; print; next} on && /^## v/ {exit} on {print}' \
            docs/changelog/releases.md > notes.md || true
          [ -s notes.md ] || echo "RIMPERIO $VERSION" > notes.md
          title="$(head -n1 notes.md | sed 's/^## //')"
          gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag

      - name: Agent-Build auf dem Tag starten
        if: steps.tag.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run agent-release.yml --ref "$TAG"
