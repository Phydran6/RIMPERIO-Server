# ---------------------------------------------------------------------------
# Datei:        .github/workflows/ci.yml
# Projekt:      RIMPERIO
# Autor:        Phydran6
# Version:      2026.11.27.14.00.00
# Beschreibung: Baut bei jedem Push/PR die drei Teile — Backend, Agent, Frontend —
#               damit Fehler früh auffallen.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version überall gleich (Semantic Versioning)
        # VERSION ist der Maßstab; config.py, package.json, package-lock.json,
        # install.sh und der Release-Verlauf müssen dazu passen.
        run: bash scripts/version.sh check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        working-directory: server/backend
        run: pip install -r requirements.txt
      - name: Import- und Syntaxprüfung
        working-directory: server/backend
        run: |
          # Fehler zusätzlich als Annotation ausgeben (ohne Anmeldung lesbar).
          if ! python -m compileall -q app > /tmp/out.txt 2>&1 \
             || ! python -c "import app.main; print('backend import ok')" >> /tmp/out.txt 2>&1; then
            cat /tmp/out.txt
            tail -n 15 /tmp/out.txt | while IFS= read -r l; do echo "::error title=Backend-Import::$l"; done
            exit 1
          fi
          cat /tmp/out.txt
      - name: Tests (ohne Datenbank)
        working-directory: server/backend
        run: python -m unittest discover -s tests -v

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: agent/go.sum
      - name: Vet + Build + Test
        working-directory: agent
        run: |
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm GOARM=6 go build ./...
          go test ./...
      - name: Linux-Installer prüfen
        # Syntax und grobe Fehler (shellcheck nur Stufe "error"); das erzeugte
        # Hilfsskript wird mit herausgezogen und ebenso geprüft.
        run: |
          set -e
          awk "/cat <<'HELPER'/{f=1;next} /^HELPER\$/{f=0} f" agent/installer/linux/install-agent.sh \
            | { printf '#!/bin/bash\nAGENT_USER=rimperio\nHELPER_VERSION=ci\n'; cat; } > /tmp/rimperio-helper
          for f in agent/installer/linux/install-agent.sh agent/logship/install-linux.sh server/setup.sh /tmp/rimperio-helper; do
            bash -n "$f" || { echo "::error title=Installer::Syntaxfehler in $f"; exit 1; }
          done
          shellcheck -S error agent/installer/linux/install-agent.sh agent/logship/install-linux.sh /tmp/rimperio-helper \
            || { echo "::error title=Installer::shellcheck meldet Fehler (siehe Log)"; exit 1; }
      - name: Synology-Paket bauen und prüfen
        # Paket-Skripte (laufen auf dem NAS mit /bin/sh), Aufbau des .spk und
        # ein Probelauf: entpacken, postinst mit Assistenten-Werten, Konfiguration da?
        run: |
          set -e
          shellcheck -S warning agent/installer/synology/scripts/* agent/installer/synology/common.sh \
            agent/installer/synology/build-spk.sh \
            || { echo "::error title=Synology-Paket::shellcheck meldet Fehler (siehe Log)"; exit 1; }
          bash agent/installer/synology/build-spk.sh
          spk=agent/bin/rimperio-agent-synology.spk
          tar -tf "$spk" | sort > /tmp/spk.lst
          for f in INFO package.tgz scripts/start-stop-status scripts/postinst scripts/preuninst conf/privilege \
                   WIZARD_UIFILES/install_uifile PACKAGE_ICON.PNG PACKAGE_ICON_256.PNG; do
            grep -qx "$f" /tmp/spk.lst || { echo "::error title=Synology-Paket::$f fehlt"; exit 1; }
          done
          python3 -c "import json,sys; json.load(open('agent/installer/synology/WIZARD_UIFILES/install_uifile')); json.load(open('agent/installer/synology/conf/privilege'))"
          w=$(mktemp -d); mkdir -p "$w/target"
          tar -xf "$spk" -C "$w"; tar -xzf "$w/package.tgz" -C "$w/target"
          test "$(tar -xOf "$spk" INFO | sed -n 's/^checksum="\(.*\)"$/\1/p')" = "$(md5sum "$w/package.tgz" | cut -d' ' -f1)"
          SYNOPKG_PKGDEST="$w/target" SYNOPKG_PKGVAR="$w/var" wizard_server=https://rmm.example.invalid \
            wizard_secret=probe wizard_site=CI sh "$w/scripts/postinst"
          grep -q '"enroll_secret": "probe"' "$w/var/etc/agent.json"
          "$w/target/bin/rimperio-agent-amd64" version

  msi:
    # Baut das MSI bei jedem Push mit und spielt Installation und Deinstallation
    # einmal echt durch — so fällt ein Fehler in der .wxs vor dem Release auf.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: agent/go.sum
      # v4 wie im Release (siehe agent-release.yml: ab v7 OSMF-EULA).
      - name: WiX installieren
        run: dotnet tool install --global wix --version 4.0.6
      - name: exe + MSI bauen
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\build.log"
          foreach ($s in 'build-agent.ps1', 'build-msi.ps1') {
            pwsh -NoProfile -File "./agent/installer/windows/$s" *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -Tail 15 | ForEach-Object { Write-Host "::error title=MSI bauen::$_" }
              exit $LASTEXITCODE
            }
          }
      - name: MSI installieren und wieder entfernen
        shell: pwsh
        run: |
          $msi = (Resolve-Path agent/installer/windows/rimperio-agent.msi).Path
          $script:fail = 0
          function Check($name, $ok) {
            if ($ok) { Write-Host "ok   $name" } else { Write-Host "::error title=MSI-Probe::$name"; $script:fail = 1 }
          }
          # Server absichtlich unerreichbar: Der Dienst startet, die Anmeldung wartet.
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$msi`" SERVER=http://127.0.0.1:9 SECRET=probe SITE=CI /qn /norestart /l*v `"$env:RUNNER_TEMP\install.log`""
          Check "Installation (Exitcode $($p.ExitCode))" ($p.ExitCode -eq 0)
          Start-Sleep -Seconds 5
          Check "Dienst läuft"              ((Get-Service rimperio-agent -ErrorAction SilentlyContinue).Status -eq 'Running')
          Check "ProductCode in Registry"   ((Get-ItemProperty HKLM:\SOFTWARE\RIMPERIO\Agent -ErrorAction SilentlyContinue).ProductCode -like '{*}')
          Check "Ereignisquelle angemeldet" (Test-Path HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\rimperio-agent)
          Check "Konfiguration angelegt"    (Test-Path C:\ProgramData\RIMPERIO\agent.json)

          $p = Start-Process msiexec -Wait -PassThru -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\uninstall.log`""
          Check "Deinstallation (Exitcode $($p.ExitCode))" ($p.ExitCode -eq 0)
          Check "Dienst entfernt"           (-not (Get-Service rimperio-agent -ErrorAction SilentlyContinue))
          Check "Registry entfernt"         (-not (Test-Path HKLM:\SOFTWARE\RIMPERIO\Agent))
          Check "Konfiguration gelöscht"    (-not (Test-Path C:\ProgramData\RIMPERIO\agent.json))
          Check "Programm entfernt"         (-not (Test-Path "$env:ProgramFiles\RIMPERIO Agent\rimperio-agent.exe"))
          if ($script:fail) {
            foreach ($f in 'install.log', 'uninstall.log') {
              Select-String -Path "$env:RUNNER_TEMP\$f" -Pattern 'AgentCleanup|Return value 3|error|Fehler' |
                Select-Object -Last 10 | ForEach-Object { Write-Host "::error title=$f::$($_.Line.Trim())" }
            }
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install + Build
        working-directory: server/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
