  <text x="256" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-weight="700" font-size="110" letter-spacing="2" fill="url(#gold)">RIMPERIO</text>
  <!-- Blitz als Akzent -->
  <path d="M243 196 L231 238 L250 238 L236 286 L272 230 L252 230 L264 196 Z" fill="url(#bg)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>

