  </defs>

  <!-- Hintergrund -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" stroke="url(#gold)" stroke-width="10"/>
  <!-- Ring -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.8"/>

