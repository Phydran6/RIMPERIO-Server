    <line x1="150" y1="360" x2="206" y2="360"/>
    <line x1="306" y1="360" x2="362" y2="360"/>
    <rect x="212" y="326" width="88" height="66" rx="6"/>
    <line x1="256" y1="392" x2="256" y2="408"/>
    <line x1="236" y1="408" x2="276" y2="408"/>
    <circle cx="256" cy="359" r="13"/>
