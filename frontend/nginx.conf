# ---------------------------------------------------------------------------
# Datei:        frontend/nginx.conf
# Projekt:      RIMPERIO — Frontend
# Autor:        Phydran6
# Version:      2026.10.31.15.40.00
# Beschreibung: Auslieferung der gebauten Oberfläche. Reines Ausliefern mit
#               History-Fallback; die API erreicht der Browser über Caddy unter
#               derselben Herkunft (/api), nicht über diesen nginx.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statische Dateien lange cachen, index.html nie.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keine Server-Version verraten.
    server_tokens off;
}
